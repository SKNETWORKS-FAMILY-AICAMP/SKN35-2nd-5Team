[project]
name = "skn35-2nd-5team"
version = "0.1.0"
description = "Employee attrition analysis and modeling dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.8",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "streamlit>=1.62.0",
    "xgboost>=3.4.1",
    "lightgbm>=4.6.0",
    "joblib>=1.5.1",
    "optuna>=4.5.0",
    "torch>=2.13.0",
    "plotly==5.24.1",
    "nbformat>=5.10.4",
    "pymysql>=1.2.0",
    "mysql-connector-python>=26.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
